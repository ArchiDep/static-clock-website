name: publish

# Publishes the image of the public demonstration to the GitHub Container
# Registry. A push to the docker branch publishes "latest". A version tag such
# as v1.2.3 publishes 1.2.3, 1.2, 1 and "latest".

on:
  push:
    branches:
      - docker
    # Release versions only: a pre-release such as v1.2.3-rc.1 must not become
    # "latest".
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  image:
    name: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # https://github.com/actions/checkout
      - name: Checkout the repository
        uses: actions/checkout@v7

      # https://github.com/docker/login-action
      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # https://github.com/docker/setup-buildx-action
      #
      # No QEMU: the Dockerfile only copies files, so building it for ARM runs
      # nothing that would need emulating.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # https://github.com/docker/metadata-action
      #
      # The semver tags are only generated for a version tag. The source label
      # links the package to this repository.
      - name: Determine the image's tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/archidep/static-clock-website
          tags: |
            type=semver,pattern={{major}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{version}}
            type=raw,value=latest

      # https://github.com/docker/build-push-action
      - name: Build and publish the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
